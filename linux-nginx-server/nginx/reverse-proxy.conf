# reverse-proxy.conf - optional server block forwarding /api to a backend
# running on 127.0.0.1:3000 (the hello-web.service demo backend).
# Enable only if the backend is running; then:
#   cp nginx/reverse-proxy.conf /etc/nginx/sites-available/reverse-proxy
#   ln -sf /etc/nginx/sites-available/reverse-proxy /etc/nginx/sites-enabled/reverse-proxy
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    server_name api.hello.local _;

    # Reverse proxy: /api/* is forwarded to the backend.
    # Trailing slash on proxy_pass strips the /api/ prefix: /api/foo -> /foo
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Everything else is served as static content from the web root.
    location / {
        root /var/www/hello-web;
        index index.html;
        try_files $uri $uri/ =404;
    }

    error_page 502 /error/502.html;

    location = /error/502.html {
        internal;
    }
}
