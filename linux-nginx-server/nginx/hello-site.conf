# hello-site.conf - static hello site, the default server on port 80.
# Install: copy to /etc/nginx/sites-available/hello-site and symlink into sites-enabled.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name hello.local _;

    root /var/www/hello-web;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide nginx version
    server_tokens off;

    # Limit request body (static site)
    client_max_body_size 1m;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 502 /error/502.html;

    location = /error/502.html {
        internal;
    }
}
