---
- name: Template hello-web systemd unit
  ansible.builtin.template:
    src: hello-web.service.j2
    dest: /etc/systemd/system/hello-web.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart hello-web

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start hello-web
  ansible.builtin.systemd:
    name: hello-web
    state: started
    enabled: true
