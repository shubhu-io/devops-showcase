---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Ensure web root exists
  ansible.builtin.file:
    path: "{{ web_root }}"
    state: directory
    owner: "{{ web_user }}"
    group: "{{ web_user }}"
    mode: "0755"

- name: Deploy static site
  ansible.builtin.copy:
    src: ../../../linux-nginx-server/web/
    dest: "{{ web_root }}/"
    owner: "{{ web_user }}"
    group: "{{ web_user }}"
    mode: "0644"
  # For standalone demo, inline content if source not present
  ignore_errors: true

- name: Ensure hello-site content
  ansible.builtin.copy:
    dest: "{{ web_root }}/index.html"
    content: |
      <!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Hello from Ansible</title>
      <style>body{font-family:system-ui;display:grid;place-items:center;min-height:100vh;margin:0;background:#f4f6f8}main{background:#fff;padding:2rem;border-radius:10px;text-align:center}</style>
      </head><body><main><h1>Hello from Ansible</h1><p>Deployed via <code>ansible-server-configuration</code></p></main></body></html>
    owner: "{{ web_user }}"
    group: "{{ web_user }}"
    mode: "0644"

- name: Template Nginx site config
  ansible.builtin.template:
    src: hello-site.conf.j2
    dest: /etc/nginx/sites-available/hello-site
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/hello-site
    dest: /etc/nginx/sites-enabled/hello-site
    state: link
  notify: Reload nginx

- name: Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Validate nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Ensure nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
