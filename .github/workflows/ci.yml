name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check server.js
        working-directory: app
      - run: node --test server.js
        working-directory: app
      - run: bash -n scripts/healthcheck.sh || true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t app:ci ./app
      - run: docker run -d -p 3000:3000 --name app-ci app:ci && sleep 3 && curl -fsS http://localhost:3000/health | grep -q '"status":"ok"' && docker rm -f app-ci
