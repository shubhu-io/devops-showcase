# nginx/app-proxy.conf
# Purpose: Nginx reverse proxy installed on the EC2 host. It listens on port
#          80 and forwards requests to the app Docker container bound to
#          127.0.0.1:3000. This is the "Nginx front + container backend"
#          pattern: Nginx owns the public surface (TLS termination, headers,
#          static files, rate limiting) while the app container stays private.
#
# Install (on EC2):
#   sudo cp app-proxy.conf /etc/nginx/conf.d/app-proxy.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Notes:
#   - The container is published with -p 80:3000 in deploy.sh, so it binds
#     host port 80. In this setup Nginx listens on 80 too, which would
#     conflict. Two supported layouts:
#       A) Container bound to 127.0.0.1:3000 (docker run -p 127.0.0.1:3000:3000)
#          and Nginx owns 80. This is the layout below.
#       B) Nginx binds 80 and proxies to the docker bridge IP (172.17.0.x:3000).
#   - Jenkins runs: docker run -d -p 127.0.0.1:3000:3000 ... so port 80 stays
#     free for Nginx. See docs/deployment.md for the exact command.

upstream node_app_backend {
    # The app container published to localhost on port 3000.
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;   # accept requests for any host/IP (no domain in this project)

    # Basic hardening: hide nginx version.
    server_tokens off;

    # Sensible request size limit.
    client_max_body_size 10m;

    location / {
        proxy_pass http://node_app_backend;
        proxy_http_version 1.1;

        # Pass the real client IP and protocol through to the app.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep-alive support for upstream.
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Fail fast if the app container is down instead of showing a raw 502 loop.
    error_page 502 /502.html;
    location = /502.html {
        root /usr/share/nginx/html;
        internal;
    }
}
